<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>量子花园 Quantum Garden</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#07090f;display:flex;
            align-items:center;justify-content:center;overflow:hidden}
  canvas{background:#000;outline:none;border-radius:4px}
</style>
</head>
<body>
<pre id="errbox" style="display:none;position:fixed;left:8px;top:8px;z-index:99;
     color:#ff9;background:#300;padding:10px;font:13px monospace;white-space:pre-wrap;
     max-width:90vw;max-height:80vh;overflow:auto"></pre>
<script>
  // 把运行期错误显示到页面左上角，方便反馈排查
  window.onerror = function(msg, src, line, col) {
    var b = document.getElementById('errbox');
    b.style.display = 'block';
    b.textContent += msg + '\n  at ' + (src||'?') + ':' + line + ':' + col + '\n';
  };
</script>
<canvas id="canvas" width="1280" height="720"
        oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
<script>
  // 新版 Emscripten 要求显式提供 Module.canvas（否则运行时初始化时报
  // "Cannot read properties of undefined (reading 'addEventListener')"）
  // 必须在加载游戏脚本之前定义好。
  // print/printErr：把 wasm 侧 stdout/stderr（raylib 的 INFO/ERROR 日志）
  // 转存到页面错误框，便于黑屏时排查。
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function(t) {
      var b = document.getElementById('errbox');
      if (t.indexOf('INFO:') === -1) { b.style.display = 'block'; b.textContent += t + '\n'; }
    },
    printErr: function(t) {
      var b = document.getElementById('errbox');
      b.style.display = 'block';
      b.textContent += t + '\n';
    }
  };
</script>
<script>
  // 画布随窗口等比缩放（保持 16:9），raylib 负责内部渲染分辨率
  (function(){
    var c = document.getElementById('canvas');
    function fit(){
      var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
      c.style.width  = Math.floor(1280 * s) + 'px';
      c.style.height = Math.floor(720  * s) + 'px';
    }
    window.addEventListener('resize', fit); fit();
    c.focus();
  })();
</script>
<!-- ===== 版本号：每次发布改成新文件名，避免浏览器/CDN 缓存旧文件 ===== -->
<script async src="game_v12.js"></script>
</body>
</html>
