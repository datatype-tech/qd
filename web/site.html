<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>量子花园 Quantum Garden</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#07090f;overflow:hidden}
  canvas{display:block;background:#000;outline:none}
</style>
</head>
<body>
<pre id="errbox" style="display:none;position:fixed;left:8px;top:8px;z-index:99;
     color:#ff9;background:#300;padding:10px;font:13px monospace;white-space:pre-wrap;
     max-width:90vw;max-height:80vh;overflow:auto"></pre>
<script>
  // 把运行期错误显示到页面左上角，方便反馈排查
  window.onerror = function(msg, src, line, col) {
    var b = document.getElementById('errbox');
    b.style.display = 'block';
    b.textContent += msg + '\n  at ' + (src||'?') + ':' + line + ':' + col + '\n';
  };
</script>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
<script>
  // 新版 Emscripten 要求显式提供 Module.canvas，必须在加载游戏脚本前定义好。
  // print/printErr：把 wasm 侧输出转到页面错误框，便于排查。
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function(t) {
      var b = document.getElementById('errbox');
      if (t.indexOf('INFO:') === -1) { b.style.display = 'block'; b.textContent += t + '\n'; }
    },
    printErr: function(t) {
      var b = document.getElementById('errbox');
      b.style.display = 'block';
      b.textContent += t + '\n';
    }
  };
</script>
<script>
  // 画布尺寸由游戏按浏览器窗口的实际像素设置（见 src/main.cpp 的 webInitAndRun），
  // 这里不再用 CSS 拉伸 1280x720 画布 —— 那会导致整屏文字发虚。
  (function(){
    var c = document.getElementById('canvas');
    c.focus();
  })();
</script>
<!-- ===== 版本号：每次发布改成新文件名，避免浏览器/CDN 缓存旧文件 ===== -->
<script async src="game_v28.js"></script>
</body>
</html>
